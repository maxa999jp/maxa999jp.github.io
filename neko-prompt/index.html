<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>ねこプロンプトメーカー</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light;
        --bg: #faf2e3;
        --bg-soft: #f3e6cf;
        --card: #fffaf0;
        --card-border: #e8d3ae;
        --ink: #43301d;
        --ink-soft: #7d6248;
        --ink-faint: #a68a68;
        --accent: #e8762d;
        --accent-deep: #c85a17;
        --accent-soft: #fdeeda;
        --accent-ink: #ffffff;
        --chip: #ffffff;
        --chip-border: #dec9a3;
        --bar: rgba(255, 250, 240, .94);
        --shadow: 0 6px 20px rgba(146, 96, 32, .12);
        --paw: rgba(232, 118, 45, .10);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #251a10;
          --bg-soft: #2e2013;
          --card: #332416;
          --card-border: #54401f;
          --ink: #f7ead2;
          --ink-soft: #cfb28c;
          --ink-faint: #9d825e;
          --accent: #f08a3c;
          --accent-deep: #f6a35c;
          --accent-soft: #463015;
          --accent-ink: #2b1a06;
          --chip: #2b1e10;
          --chip-border: #5d4525;
          --bar: rgba(37, 26, 16, .94);
          --shadow: 0 6px 20px rgba(0, 0, 0, .35);
          --paw: rgba(240, 138, 60, .09);
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
        line-height: 1.6;
        padding-bottom: 148px;
      }
      .wrap { max-width: 880px; margin: 0 auto; padding: 18px 16px 8px; position: relative; }
      .paw-deco { position: absolute; color: var(--accent); opacity: .13; pointer-events: none; }

      /* ---- ヒーロー（プレビュー） ---- */
      .hero { position: relative; border-radius: 26px; overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--card-border); background: var(--card); }
      .hero img { display: block; width: 100%; height: 300px; object-fit: cover; object-position: center 62%; }
      .hero .hero-cap {
        position: absolute; left: 14px; bottom: 12px; right: 14px;
        display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; flex-wrap: wrap;
      }
      .hero .hero-tag {
        background: var(--bar); backdrop-filter: blur(6px); border: 1px solid var(--card-border);
        border-radius: 14px; padding: 8px 14px; font-size: 12.5px; color: var(--ink-soft); font-weight: 700;
      }
      .hero .hero-tag b { color: var(--ink); }
      .lead { margin: 16px 4px 4px; font-size: 15px; color: var(--ink-soft); }
      .lead b { color: var(--ink); }

      /* ---- カテゴリカード ---- */
      .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
      .cat-card {
        background: var(--card); border: 1px solid var(--card-border); border-radius: 20px;
        padding: 16px 16px 14px; box-shadow: var(--shadow); position: relative; overflow: hidden;
      }
      .cat-card::after {
        content: ""; position: absolute; right: -14px; top: -14px; width: 58px; height: 58px; border-radius: 50%;
        background: var(--accent-soft);
      }
      .cat-card h2 {
        font-family: "Zen Maru Gothic", "M PLUS Rounded 1c", sans-serif;
        font-size: 16px; font-weight: 900; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; position: relative; z-index: 1;
      }
      .cat-card h2 .step {
        font-family: "M PLUS Rounded 1c", sans-serif; font-size: 11px; font-weight: 800; color: var(--accent-ink);
        background: var(--accent); border-radius: 999px; padding: 2px 8px; letter-spacing: .04em; flex: none;
      }
      .cat-card .picked { font-size: 12.5px; color: var(--accent-deep); font-weight: 800; margin: 0 0 10px; position: relative; z-index: 1; }
      .chips { display: flex; flex-wrap: wrap; gap: 7px; position: relative; z-index: 1; }
      .chip {
        appearance: none; border: 1.5px solid var(--chip-border); background: var(--chip); color: var(--ink);
        font: inherit; font-weight: 700; font-size: 13.5px; padding: 7px 13px; border-radius: 999px; cursor: pointer;
        transition: background .12s ease, border-color .12s ease, color .12s ease;
      }
      .chip:hover { border-color: var(--accent); }
      .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
      .chip:focus-visible, .btn:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

      /* ---- プロンプト欄 ---- */
      .prompt-section { margin-top: 22px; background: var(--card); border: 1px solid var(--card-border); border-radius: 20px; padding: 18px; box-shadow: var(--shadow); }
      .prompt-section h2 { font-family: "Zen Maru Gothic", "M PLUS Rounded 1c", sans-serif; font-size: 17px; font-weight: 900; margin: 0; }
      .prompt-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
      .prompt-head .count { font-size: 12.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
      textarea {
        width: 100%; min-height: 170px; resize: vertical; border-radius: 14px; border: 1.5px solid var(--chip-border);
        background: var(--bg); color: var(--ink); font: inherit; font-size: 14.5px; line-height: 1.85; padding: 14px;
      }
      .note { font-size: 12.5px; color: var(--ink-soft); margin: 8px 2px 0; }
      .sub-row { display: flex; gap: 9px; margin-top: 12px; flex-wrap: wrap; }

      /* ---- ボタン ---- */
      .btn {
        appearance: none; border: 1.5px solid var(--chip-border); background: var(--chip); color: var(--ink);
        font: inherit; font-weight: 800; font-size: 14px; padding: 10px 16px; border-radius: 999px; cursor: pointer;
        transition: background .13s ease, border-color .13s ease, transform .08s ease;
      }
      .btn:hover { border-color: var(--accent); }
      .btn:active { transform: scale(.97); }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
      .btn.primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
      .btn.big { font-size: 15.5px; padding: 13px 22px; }

      /* ---- 下部固定バー ---- */
      .bottombar {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
        background: var(--bar); backdrop-filter: blur(10px); border-top: 1.5px solid var(--card-border);
        padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      }
      .bottombar .inner { max-width: 880px; margin: 0 auto; }
      .bottombar .sel-line {
        font-size: 12.5px; color: var(--ink-soft); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0 2px 8px;
      }
      .bottombar .sel-line b { color: var(--accent-deep); }
      .bottombar .row { display: flex; gap: 9px; align-items: center; }
      .bottombar .row .btn { flex: 1; }
      .bottombar .count { font-size: 12px; color: var(--ink-faint); font-variant-numeric: tabular-nums; flex: none; }

      footer { margin-top: 26px; padding: 16px 4px 10px; font-size: 12.5px; color: var(--ink-faint); text-align: center; }
      .toast {
        position: fixed; left: 50%; bottom: 158px; transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
        background: var(--ink); color: var(--bg); font-weight: 800; font-size: 14px;
        padding: 10px 22px; border-radius: 999px; transition: opacity .2s ease, transform .2s ease; z-index: 60;
        box-shadow: 0 8px 24px rgba(0,0,0,.25);
      }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }

      @media (max-width: 680px) {
        .cards { grid-template-columns: 1fr; }
        .hero img { height: 150px; object-position: center 25%; }
        .hero .hero-cap { position: static; padding: 10px 12px; background: var(--card); }
        .hero .hero-tag { background: var(--accent-soft); border: none; font-size: 12px; padding: 5px 10px; }
        .bottombar .sel-line { display: none; }
        .bottombar .btn.big { font-size: 14.5px; padding: 11px 8px; white-space: nowrap; }
        body { padding-bottom: 92px; }
      }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
  </head>

        parts.push("背景は" + phrase("background") + "。");
        parts.push(phrase("style") + "、" + phrase("framing") + "、比率は" + phrase("ratio") + "。");
        parts.push("高品質で細部まで丁寧に描かれた、かわいい猫の作品。");
        return parts.join("");
      }

      var SUMMARY_IDS = ["breed", "pattern", "fur", "age", "eye", "ear", "tail", "expression", "pose", "item", "framing", "background", "style", "ratio"];

      function updateCounts() {
        countEl.textContent = promptEl.value.length + " / 8000";
        barCountEl.textContent = promptEl.value.length + "字";
      }

      function renderSummary() {
        summaryEl.innerHTML = "";
        summaryEl.appendChild(document.createTextNode("選択中："));
        var b = document.createElement("b");
        b.textContent = SUMMARY_IDS.map(function (id) { return label(id); }).join(" ・ ");
        summaryEl.appendChild(b);
      }

      function refresh(forcePrompt) {
        renderSummary();
        document.querySelectorAll(".picked").forEach(function (el) {
          el.textContent = "選択中：" + label(el.getAttribute("data-for"));
        });
        if (forcePrompt || !dirty) { promptEl.value = buildPrompt(); dirty = false; }
        updateCounts();
      }

      function renderOptions() {
        optionsEl.innerHTML = "";
        CATEGORIES.forEach(function (cat, ci) {
          var card = document.createElement("section");
          card.className = "cat-card";
          card.setAttribute("aria-label", cat.title);
          var h = document.createElement("h2");
          var step = document.createElement("span");
          step.className = "step"; step.textContent = (ci + 1) + "";
          h.appendChild(step);
          h.appendChild(document.createTextNode(cat.title));
          card.appendChild(h);
          var picked = document.createElement("p");
          picked.className = "picked"; picked.setAttribute("data-for", cat.id);
          card.appendChild(picked);
          var chips = document.createElement("div");
          chips.className = "chips"; chips.setAttribute("role", "group"); chips.setAttribute("aria-label", cat.title);
          cat.options.forEach(function (opt, idx) {
            var btn = document.createElement("button");
            btn.type = "button"; btn.className = "chip"; btn.textContent = opt[0];
            btn.setAttribute("aria-pressed", state[cat.id] === idx ? "true" : "false");
            btn.addEventListener("click", function () {
              state[cat.id] = idx;
              var all = chips.querySelectorAll(".chip");
              for (var i = 0; i < all.length; i++) all[i].setAttribute("aria-pressed", i === idx ? "true" : "false");
              refresh(false);
            });
            chips.appendChild(btn);
          });
          card.appendChild(chips);
          optionsEl.appendChild(card);
        });
      }

      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 1800);
      }

      function resetState() { for (var k in DEFAULTS) state[k] = DEFAULTS[k]; }

      resetState();
      renderOptions();
      refresh(true);

      promptEl.addEventListener("input", function () { dirty = true; updateCounts(); });

      document.getElementById("btn-generate").addEventListener("click", function () {
        refresh(true); showToast("プロンプトを生成しました");
        document.querySelector(".prompt-section").scrollIntoView({ behavior: "smooth", block: "center" });
      });

      document.getElementById("btn-copy").addEventListener("click", function () {
        var text = promptEl.value;
        if (!text) { showToast("プロンプトが空です"); return; }
        function done() { showToast("コピーしました"); }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done, function () {
            promptEl.select(); document.execCommand("copy"); done();
          });
        } else { promptEl.select(); document.execCommand("copy"); done(); }
      });

      document.getElementById("btn-clear").addEventListener("click", function () {
        promptEl.value = ""; dirty = true; updateCounts(); promptEl.focus();
      });

      document.getElementById("btn-save").addEventListener("click", function () {
        var text = promptEl.value;
        if (!text) { showToast("プロンプトが空です"); return; }
        var now = new Date();
        var pad = function (n) { return (n < 10 ? "0" : "") + n; };
        var name = "neko_prompt_" + now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + "_" + pad(now.getHours()) + pad(now.getMinutes()) + ".txt";
        var blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        saveNoteEl.textContent = "「" + name + "」を保存しました。保存先はブラウザのダウンロードフォルダです。";
      });

      document.getElementById("btn-random").addEventListener("click", function () {
        CATEGORIES.forEach(function (cat) { state[cat.id] = Math.floor(Math.random() * cat.options.length); });
        renderOptions(); refresh(true); showToast("ランダムで選びました");
      });

      document.getElementById("btn-reset").addEventListener("click", function () {
        resetState(); renderOptions(); refresh(true); showToast("リセットしました");
      });
    </script>
  </body>
</html>
